# Proposal only; keys become enforced schema during M0 implementation.
model:
  architecture: decoder_only_transformer
  d_model: 128
  n_layers: 2
  n_heads: 4
  d_ff: 512
  context_length: 256
  dropout: 0.1
  tokenizer: character
training:
  seed: 42
  batch_size: 16
  gradient_accumulation: 4
  learning_rate: 0.0003
  max_steps: 5000
  eval_every_steps: 200
  checkpoint_every_seconds: 600
  device: auto
  precision: fp32
adaptive:
  enabled: false
  max_experts: 8
