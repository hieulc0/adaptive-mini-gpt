[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-mini-gpt"
version = "0.1.0"
description = "Experimental adaptive capacity language model research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1"]

[project.scripts]
amg = "adaptive_mini_gpt.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "runs"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
